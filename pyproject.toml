[project]
name = "keep-notes"
dynamic = ["version"]
description = "Self-hosted notes and checklists, your own free take on Google Keep"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["flask==3.1.3", "waitress==3.0.2", "markdown-it-py==4.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.dynamic]
version = { attr = "keepnotes.__version__" }

[tool.setuptools.packages.find]
include = ["keepnotes*"]

[tool.setuptools.package-data]
keepnotes = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
